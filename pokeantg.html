<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pokédex</title>

    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {
            min-height: 100vh;
            background: #222;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }


        /* =====================================================
           POKEDEX
        ===================================================== */

        .pokedex {
            width: 1200px;
            max-width: 100%;

            background: #d8d88a;

            border: 8px solid #111;
            border-radius: 20px;

            padding: 25px;

            box-shadow:
                10px 10px 0 #000;
        }


        /* =====================================================
           TITULO
        ===================================================== */

        h1 {
            text-align: center;

            font-size: 42px;
            letter-spacing: 5px;

            margin-bottom: 20px;

            color: #222;

            text-shadow:
                3px 3px 0 #aaa;
        }


        /* =====================================================
           BARRA DE PESQUISA
        ===================================================== */

        .barra-pesquisa {
            width: 100%;

            display: flex;
            gap: 10px;

            margin-bottom: 15px;
        }


        .campo-pesquisa {
            flex: 1;
            position: relative;
        }


        #campoPesquisa {
            width: 100%;
            height: 50px;

            padding: 0 45px 0 15px;

            border: 4px solid #111;
            border-radius: 8px;

            background: #f5f5f5;

            font-size: 17px;
            font-weight: bold;

            outline: none;
        }


        #campoPesquisa:focus {
            background: white;
            border-color: #333;
        }


        #limparPesquisa {
            position: absolute;

            right: 12px;
            top: 50%;

            transform: translateY(-50%);

            border: none;
            background: transparent;

            font-size: 22px;
            font-weight: bold;

            cursor: pointer;

            display: none;
        }


        /* =====================================================
           FILTRO
        ===================================================== */

        #filtroTipo {
            height: 50px;

            min-width: 180px;

            padding: 0 10px;

            border: 4px solid #111;
            border-radius: 8px;

            background: #f5f5f5;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;

            outline: none;
        }


        /* =====================================================
           ABAS
        ===================================================== */

        .abas {
            display: flex;
            gap: 8px;

            margin-bottom: 20px;
        }


        .aba {
            padding: 11px 20px;

            border: 4px solid #111;
            border-radius: 8px;

            background: #aaa;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;
        }


        .aba:hover {
            background: #ccc;
        }


        .aba.ativa {
            background: #6868b8;
            color: white;
        }


        /* =====================================================
           CONTEUDO
        ===================================================== */

        .conteudo {
            display: flex;
            gap: 20px;
        }


        /* =====================================================
           DISPLAY
        ===================================================== */

        .pokemon-display {
            width: 45%;

            min-height: 550px;

            background: #a8b878;

            border: 6px solid #111;
            border-radius: 10px;

            display: flex;
            flex-direction: column;
            align-items: center;

            padding: 15px;

            overflow: hidden;
        }


        /* =====================================================
           NUMERO
        ===================================================== */

        #numeroPokemon {
            font-size: 22px;
            font-weight: bold;

            margin-bottom: 5px;
        }


        /* =====================================================
           RODA
        ===================================================== */

        .roda {
            position: relative;

            width: 260px;
            height: 300px;

            overflow: hidden;

            margin-top: 5px;
        }


        .pokemon-roda {
            position: absolute;

            left: 50%;

            transform: translateX(-50%);

            object-fit: contain;

            image-rendering: pixelated;

            pointer-events: none;
        }


        .atual {
            width: 190px;
            height: 190px;

            top: 55px;

            opacity: 1;

            z-index: 3;
        }


        .anterior {
            width: 100px;
            height: 100px;

            top: -45px;

            opacity: 0.35;

            z-index: 1;
        }


        .proximo {
            width: 100px;
            height: 100px;

            top: 245px;

            opacity: 0.35;

            z-index: 1;
        }


        /* =====================================================
           ANIMACAO PARA BAIXO
        ===================================================== */

        .saindo-baixo {
            animation:
                sairBaixo
                350ms
                ease-in
                forwards;
        }


        .entrando-baixo {
            animation:
                entrarBaixo
                350ms
                ease-out
                forwards;
        }


        @keyframes sairBaixo {

            from {
                transform:
                    translateX(-50%)
                    translateY(0)
                    scale(1);

                opacity: 1;
            }

            to {
                transform:
                    translateX(-50%)
                    translateY(150px)
                    scale(0.5);

                opacity: 0;
            }

        }


        @keyframes entrarBaixo {

            from {
                transform:
                    translateX(-50%)
                    translateY(-150px)
                    scale(0.5);

                opacity: 0;
            }

            to {
                transform:
                    translateX(-50%)
                    translateY(0)
                    scale(1);

                opacity: 1;
            }

        }


        /* =====================================================
           ANIMACAO PARA CIMA
        ===================================================== */

        .saindo-cima {
            animation:
                sairCima
                350ms
                ease-in
                forwards;
        }


        .entrando-cima {
            animation:
                entrarCima
                350ms
                ease-out
                forwards;
        }


        @keyframes sairCima {

            from {
                transform:
                    translateX(-50%)
                    translateY(0)
                    scale(1);

                opacity: 1;
            }

            to {
                transform:
                    translateX(-50%)
                    translateY(-150px)
                    scale(0.5);

                opacity: 0;
            }

        }


        @keyframes entrarCima {

            from {
                transform:
                    translateX(-50%)
                    translateY(150px)
                    scale(0.5);

                opacity: 0;
            }

            to {
                transform:
                    translateX(-50%)
                    translateY(0)
                    scale(1);

                opacity: 1;
            }

        }


        /* =====================================================
           NOME
        ===================================================== */

        #pokemonNome {
            font-size: 25px;
            font-weight: bold;

            margin-top: 5px;

            text-align: center;
        }


        /* =====================================================
           FAVORITO
        ===================================================== */

        #favoritoBtn {
            margin-top: 10px;

            padding: 10px 18px;

            border: 4px solid #111;
            border-radius: 8px;

            background: #eee;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;
        }


        #favoritoBtn:hover {
            background: white;
        }


        /* =====================================================
           DETALHES
        ===================================================== */

        .detalhes {
            width: 100%;

            margin-top: 12px;

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 8px;
        }


        .detalhe {
            background: #d0d0d0;

            border: 3px solid #222;

            padding: 7px;

            font-size: 14px;
            font-weight: bold;
        }


        .detalhe span {
            display: block;

            font-size: 12px;

            margin-bottom: 3px;
        }


        /* =====================================================
           TIPOS
        ===================================================== */

        .tipos {
            display: flex;

            gap: 5px;

            flex-wrap: wrap;
        }


        .tipo {
            padding: 4px 7px;

            background: #6868b8;

            color: white;

            border-radius: 5px;

            font-size: 11px;
        }


        /* =====================================================
           STATUS
        ===================================================== */

        .status {
            width: 100%;

            margin-top: 10px;
        }


        .status h3 {
            font-size: 15px;

            margin-bottom: 5px;
        }


        .status-linha {
            display: flex;

            justify-content: space-between;

            font-size: 12px;

            margin-bottom: 3px;
        }


        /* =====================================================
           LISTA
        ===================================================== */

        #listaPokemon {
            width: 55%;

            height: 550px;

            background: #888;

            border: 6px solid #111;

            border-radius: 10px;

            overflow-y: auto;

            padding: 8px;
        }


        #listaPokemon::-webkit-scrollbar {
            width: 12px;
        }


        #listaPokemon::-webkit-scrollbar-track {
            background: #333;
        }


        #listaPokemon::-webkit-scrollbar-thumb {
            background: #aaa;

            border: 2px solid #333;
        }


        /* =====================================================
           ITEM DA LISTA
        ===================================================== */

        .pokemon-item {
            padding: 8px 10px;

            margin-bottom: 4px;

            background: #d0d0d0;

            border: 3px solid #222;

            font-weight: bold;

            font-size: 15px;

            cursor: pointer;

            transition: 0.15s;
        }


        .pokemon-item:hover {
            background: #eee;

            transform:
                translateX(3px);
        }


        .pokemon-item.selecionado {
            background: #6868b8;

            color: white;

            border-color: #111;

            transform:
                translateX(5px);
        }


        .estrela {
            float: right;

            font-size: 18px;
        }


        /* =====================================================
           MENSAGENS
        ===================================================== */

        .carregando {
            text-align: center;

            font-size: 20px;

            padding: 30px;

            font-weight: bold;
        }


        .nenhum {
            text-align: center;

            padding: 40px 15px;

            font-size: 18px;

            font-weight: bold;
        }


        /* =====================================================
           INSTRUCOES
        ===================================================== */

        .instrucoes {
            text-align: center;

            margin-top: 20px;

            font-weight: bold;

            font-size: 16px;
        }


        /* =====================================================
           RESPONSIVO
        ===================================================== */

        @media (max-width: 900px) {

            .conteudo {
                flex-direction: column;
            }


            .pokemon-display {
                width: 100%;
            }


            #listaPokemon {
                width: 100%;
            }

        }


        @media (max-width: 600px) {

            body {
                padding: 10px;
            }


            .pokedex {
                padding: 15px;
            }


            h1 {
                font-size: 30px;
            }


            .barra-pesquisa {
                flex-direction: column;
            }


            #filtroTipo {
                width: 100%;
            }


            .abas {
                flex-direction: column;
            }


            .aba {
                width: 100%;
            }


            .detalhes {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>

<div class="pokedex">


    <!-- =====================================================
         TITULO
    ====================================================== -->

    <h1>POKÉDEX</h1>


    <!-- =====================================================
         BARRA DE PESQUISA
    ====================================================== -->

    <div class="barra-pesquisa">

        <div class="campo-pesquisa">

            <input
                type="text"
                id="campoPesquisa"
                placeholder="🔎 Pesquisar Pokémon pelo nome..."
                autocomplete="off"
            >

            <button
                id="limparPesquisa"
                title="Limpar pesquisa"
            >
                ✕
            </button>

        </div>


        <select id="filtroTipo">

            <option value="todos">
                Todos os tipos
            </option>

        </select>

    </div>


    <!-- =====================================================
         ABAS
    ====================================================== -->

    <div class="abas">

        <button
            class="aba ativa"
            id="abaTodos"
        >
            📖 Pokédex
        </button>


        <button
            class="aba"
            id="abaFavoritos"
        >
            ⭐ Favoritos
        </button>

    </div>


    <!-- =====================================================
         CONTEUDO
    ====================================================== -->

    <div class="conteudo">


        <!-- =================================================
             DISPLAY
        ================================================== -->

        <div class="pokemon-display">


            <div id="numeroPokemon">
                Nº001
            </div>


            <div class="roda">


                <img
                    id="pokemonAnterior"
                    class="pokemon-roda anterior"
                    src=""
                    alt=""
                >


                <img
                    id="pokemonImagem"
                    class="pokemon-roda atual"
                    src=""
                    alt=""
                >


                <img
                    id="pokemonProximo"
                    class="pokemon-roda proximo"
                    src=""
                    alt=""
                >


            </div>


            <div id="pokemonNome">
                CARREGANDO...
            </div>


            <button
                id="favoritoBtn"
            >
                ☆ Adicionar aos favoritos
            </button>


            <!-- =============================================
                 DETALHES
            ============================================== -->

            <div class="detalhes">


                <div class="detalhe">

                    <span>TIPO</span>

                    <div
                        id="pokemonTipos"
                        class="tipos"
                    >
                        -
                    </div>

                </div>


                <div class="detalhe">

                    <span>HABILIDADES</span>

                    <div id="pokemonHabilidades">
                        -
                    </div>

                </div>


                <div class="detalhe">

                    <span>ALTURA</span>

                    <div id="pokemonAltura">
                        -
                    </div>

                </div>


                <div class="detalhe">

                    <span>PESO</span>

                    <div id="pokemonPeso">
                        -
                    </div>

                </div>


            </div>


            <!-- =============================================
                 STATUS
            ============================================== -->

            <div class="status">

                <h3>ATRIBUTOS</h3>


                <div class="status-linha">

                    <span>HP</span>

                    <strong id="hp">
                        -
                    </strong>

                </div>


                <div class="status-linha">

                    <span>Ataque</span>

                    <strong id="ataque">
                        -
                    </strong>

                </div>


                <div class="status-linha">

                    <span>Defesa</span>

                    <strong id="defesa">
                        -
                    </strong>

                </div>


                <div class="status-linha">

                    <span>Sp. Ataque</span>

                    <strong id="spAtaque">
                        -
                    </strong>

                </div>


                <div class="status-linha">

                    <span>Sp. Defesa</span>

                    <strong id="spDefesa">
                        -
                    </strong>

                </div>


                <div class="status-linha">

                    <span>Velocidade</span>

                    <strong id="velocidade">
                        -
                    </strong>

                </div>


            </div>


        </div>


        <!-- =================================================
             LISTA
        ================================================== -->

        <div id="listaPokemon">

            <div class="carregando">
                Carregando Pokémon...
            </div>

        </div>


    </div>


    <div class="instrucoes">

        ↑ ↓ Use as setas do teclado para navegar

        <br>

        Clique em um Pokémon para visualizar seus detalhes

    </div>


</div>


<script>

    /* =========================================================
       API
    ========================================================= */

    const API =
        "https://pokeapi.co/api/v2/pokemon/";

    const LIMITE = 151;


    /* =========================================================
       ELEMENTOS
    ========================================================= */

    const listaPokemon =
        document.getElementById(
            "listaPokemon"
        );


    const pokemonImagem =
        document.getElementById(
            "pokemonImagem"
        );


    const pokemonAnterior =
        document.getElementById(
            "pokemonAnterior"
        );


    const pokemonProximo =
        document.getElementById(
            "pokemonProximo"
        );


    const pokemonNome =
        document.getElementById(
            "pokemonNome"
        );


    const numeroPokemon =
        document.getElementById(
            "numeroPokemon"
        );


    const favoritoBtn =
        document.getElementById(
            "favoritoBtn"
        );


    const campoPesquisa =
        document.getElementById(
            "campoPesquisa"
        );


    const limparPesquisa =
        document.getElementById(
            "limparPesquisa"
        );


    const filtroTipo =
        document.getElementById(
            "filtroTipo"
        );


    const abaTodos =
        document.getElementById(
            "abaTodos"
        );


    const abaFavoritos =
        document.getElementById(
            "abaFavoritos"
        );


    /* =========================================================
       VARIAVEIS
    ========================================================= */

    let pokemons = [];

    let detalhes = [];

    let selecionado = 0;

    let animando = false;

    let modoFavoritos = false;


    /*
       Recupera favoritos salvos
       no navegador.
    */

    let favoritos =
        JSON.parse(
            localStorage.getItem(
                "pokemonsFavoritos"
            )
        ) || [];


    /* =========================================================
       CARREGAR POKEMONS
    ========================================================= */

    async function carregarPokemons() {

        try {

            listaPokemon.innerHTML = `

                <div class="carregando">

                    ⏳ Carregando Pokémon...

                </div>

            `;


            const resposta =
                await fetch(
                    API +
                    "?limit=151&offset=0"
                );


            if (!resposta.ok) {

                throw new Error(
                    "Erro na API"
                );

            }


            const dados =
                await resposta.json();


            pokemons =
                dados.results;


            await carregarDetalhes();


            criarFiltros();


            mostrarInicial();

        }


        catch (erro) {

            console.error(erro);


            listaPokemon.innerHTML = `

                <div class="carregando">

                    ❌ Erro ao carregar
                    os Pokémon.

                    <br><br>

                    Verifique sua conexão.

                </div>

            `;

        }

    }


    /* =========================================================
       CARREGAR DETALHES
    ========================================================= */

    async function carregarDetalhes() {

        const requisicoes =
            pokemons.map(
                (pokemon, index) => {

                    return fetch(
                        API +
                        (index + 1)
                    )
                    .then(
                        resposta =>
                            resposta.json()
                    );

                }
            );


        detalhes =
            await Promise.all(
                requisicoes
            );

    }


    /* =========================================================
       CRIAR FILTROS
    ========================================================= */

    function criarFiltros() {

        const tipos =
            new Set();


        detalhes.forEach(
            pokemon => {

                pokemon.types.forEach(
                    tipo => {

                        tipos.add(
                            tipo.type.name
                        );

                    }
                );

            }
        );


        Array
            .from(tipos)
            .sort()
            .forEach(
                tipo => {

                    const option =
                        document.createElement(
                            "option"
                        );


                    option.value =
                        tipo;


                    option.textContent =
                        formatarNome(
                            tipo
                        );


                    filtroTipo.appendChild(
                        option
                    );

                }
            );

    }


    /* =========================================================
       FORMATAR NOME
    ========================================================= */

    function formatarNome(nome) {

        return (
            nome
                .charAt(0)
                .toUpperCase()
        ) +
        nome.slice(1);

    }


    /* =========================================================
       CRIAR LISTA
    ========================================================= */

    function criarLista() {

        listaPokemon.innerHTML = "";


        let lista =
            detalhes.map(
                (pokemon, index) => {

                    return {
                        pokemon,
                        index
                    };

                }
            );


        /* =====================================================
           FAVORITOS
        ===================================================== */

        if (modoFavoritos) {

            lista =
                lista.filter(
                    item =>
                        favoritos.includes(
                            item.pokemon.id
                        )
                );

        }


        /* =====================================================
           PESQUISA
        ===================================================== */

        const pesquisa =
            campoPesquisa.value
                .toLowerCase()
                .trim();


        if (pesquisa !== "") {

            lista =
                lista.filter(
                    item =>
                        item.pokemon.name
                            .toLowerCase()
                            .includes(
                                pesquisa
                            )
                );

        }


        /* =====================================================
           FILTRO POR TIPO
        ===================================================== */

        const tipoSelecionado =
            filtroTipo.value;


        if (
            tipoSelecionado !==
            "todos"
        ) {

            lista =
                lista.filter(
                    item =>
                        item.pokemon.types.some(
                            tipo =>
                                tipo.type.name ===
                                tipoSelecionado
                        )
                );

        }


        /* =====================================================
           NENHUM RESULTADO
        ===================================================== */

        if (lista.length === 0) {

            if (modoFavoritos) {

                listaPokemon.innerHTML = `

                    <div class="nenhum">

                        ⭐ Nenhum Pokémon
                        favorito encontrado.

                    </div>

                `;

            }

            else {

                listaPokemon.innerHTML = `

                    <div class="nenhum">

                        🔍 Nenhum Pokémon encontrado.

                        <br><br>

                        Tente outro nome ou tipo.

                    </div>

                `;

            }

            return;

        }


        /* =====================================================
           ITENS
        ===================================================== */

        lista.forEach(
            itemDados => {

                const pokemon =
                    itemDados.pokemon;


                const index =
                    itemDados.index;


                const item =
                    document.createElement(
                        "div"
                    );


                item.classList.add(
                    "pokemon-item"
                );


                if (
                    index ===
                    selecionado
                ) {

                    item.classList.add(
                        "selecionado"
                    );

                }


                const numero =
                    String(
                        pokemon.id
                    )
                    .padStart(
                        3,
                        "0"
                    );


                const ehFavorito =
                    favoritos.includes(
                        pokemon.id
                    );


                item.innerHTML = `

                    Nº${numero}

                    ${pokemon.name.toUpperCase()}

                    <span class="estrela">

                        ${
                            ehFavorito
                                ? "★"
                                : "☆"
                        }

                    </span>

                `;


                /* =================================================
                   CLIQUE NO POKEMON

                   IMPORTANTE:
                   NÃO alteramos modoFavoritos aqui.

                   Assim, se estiver em Favoritos,
                   continua em Favoritos.
                ================================================== */

                item.addEventListener(
                    "click",
                    () => {

                        if (animando) {
                            return;
                        }


                        if (
                            index ===
                            selecionado
                        ) {

                            criarLista();

                            return;

                        }


                        const direcao =
                            index >
                            selecionado
                                ? "baixo"
                                : "cima";


                        selecionado =
                            index;


                        /*
                           NÃO fazemos:

                           modoFavoritos = false;

                           Isso mantém a aba atual.
                        */


                        trocarPokemon(
                            direcao
                        );

                    }
                );


                listaPokemon.appendChild(
                    item
                );

            }
        );

    }


    /* =========================================================
       MOSTRAR INICIAL
    ========================================================= */

    function mostrarInicial() {

        const atual =
            detalhes[
                selecionado
            ];


        const anterior =
            detalhes[
                (
                    selecionado -
                    1 +
                    LIMITE
                ) %
                LIMITE
            ];


        const proximo =
            detalhes[
                (
                    selecionado +
                    1
                ) %
                LIMITE
            ];


        pokemonImagem.src =
            atual.sprites
                .front_default;


        pokemonAnterior.src =
            anterior.sprites
                .front_default;


        pokemonProximo.src =
            proximo.sprites
                .front_default;


        atualizarInformacoes(
            atual
        );


        /*
           CORREÇÃO DO ERRO:

           Antes estava:
           atualizarLista();

           Essa função não existe.

           A função correta é:
           criarLista();
        */

        criarLista();

    }


    /* =========================================================
       INFORMACOES
    ========================================================= */

    function atualizarInformacoes(
        pokemon
    ) {

        numeroPokemon.textContent =
            "Nº" +
            String(
                pokemon.id
            )
            .padStart(
                3,
                "0"
            );


        pokemonNome.textContent =
            pokemon.name
                .toUpperCase();


        /* =====================================================
           TIPOS
        ===================================================== */

        const tipos =
            document.getElementById(
                "pokemonTipos"
            );


        tipos.innerHTML = "";


        pokemon.types.forEach(
            tipo => {

                const span =
                    document.createElement(
                        "span"
                    );


                span.className =
                    "tipo";


                span.textContent =
                    formatarNome(
                        tipo.type.name
                    );


                tipos.appendChild(
                    span
                );

            }
        );


        /* =====================================================
           HABILIDADES
        ===================================================== */

        document.getElementById(
            "pokemonHabilidades"
        ).textContent =

            pokemon.abilities
                .map(
                    habilidade =>
                        formatarNome(
                            habilidade
                                .ability
                                .name
                        )
                )
                .join(", ");


        /* =====================================================
           ALTURA
        ===================================================== */

        document.getElementById(
            "pokemonAltura"
        ).textContent =

            (
                pokemon.height /
                10
            ) +
            " m";


        /* =====================================================
           PESO
        ===================================================== */

        document.getElementById(
            "pokemonPeso"
        ).textContent =

            (
                pokemon.weight /
                10
            ) +
            " kg";


        /* =====================================================
           STATUS
        ===================================================== */

        document.getElementById(
            "hp"
        ).textContent =
            pokemon.stats[0]
                .base_stat;


        document.getElementById(
            "ataque"
        ).textContent =
            pokemon.stats[1]
                .base_stat;


        document.getElementById(
            "defesa"
        ).textContent =
            pokemon.stats[2]
                .base_stat;


        document.getElementById(
            "spAtaque"
        ).textContent =
            pokemon.stats[3]
                .base_stat;


        document.getElementById(
            "spDefesa"
        ).textContent =
            pokemon.stats[4]
                .base_stat;


        document.getElementById(
            "velocidade"
        ).textContent =
            pokemon.stats[5]
                .base_stat;


        atualizarBotaoFavorito();

    }


    /* =========================================================
       TROCAR POKEMON
    ========================================================= */

    function trocarPokemon(
        direcao
    ) {

        if (animando) {
            return;
        }


        animando = true;


        const imagemAtual =
            pokemonImagem;


        imagemAtual.classList.remove(
            "saindo-baixo",
            "saindo-cima",
            "entrando-baixo",
            "entrando-cima"
        );


        void imagemAtual.offsetWidth;


        if (
            direcao ===
            "baixo"
        ) {

            imagemAtual.classList.add(
                "saindo-baixo"
            );

        }

        else {

            imagemAtual.classList.add(
                "saindo-cima"
            );

        }


        setTimeout(
            () => {

                const novoAtual =
                    detalhes[
                        selecionado
                    ];


                const novoAnterior =
                    detalhes[
                        (
                            selecionado -
                            1 +
                            LIMITE
                        ) %
                        LIMITE
                    ];


                const novoProximo =
                    detalhes[
                        (
                            selecionado +
                            1
                        ) %
                        LIMITE
                    ];


                pokemonAnterior.src =
                    novoAnterior
                        .sprites
                        .front_default;


                pokemonProximo.src =
                    novoProximo
                        .sprites
                        .front_default;


                imagemAtual.classList.remove(
                    "saindo-baixo",
                    "saindo-cima"
                );


                if (
                    direcao ===
                    "baixo"
                ) {

                    imagemAtual.style.transform =
                        "translateX(-50%) translateY(-150px) scale(0.5)";

                }

                else {

                    imagemAtual.style.transform =
                        "translateX(-50%) translateY(150px) scale(0.5)";

                }


                imagemAtual.style.opacity =
                    "0";


                imagemAtual.src =
                    novoAtual
                        .sprites
                        .front_default;


                void imagemAtual.offsetWidth;


                imagemAtual.style.transform =
                    "";


                imagemAtual.style.opacity =
                    "";


                if (
                    direcao ===
                    "baixo"
                ) {

                    imagemAtual.classList.add(
                        "entrando-baixo"
                    );

                }

                else {

                    imagemAtual.classList.add(
                        "entrando-cima"
                    );

                }


                atualizarInformacoes(
                    novoAtual
                );


                /*
                   Atualiza a lista sem
                   sair da aba atual.
                */

                criarLista();


                setTimeout(
                    () => {

                        imagemAtual.classList.remove(
                            "entrando-baixo",
                            "entrando-cima"
                        );


                        imagemAtual.style.transform =
                            "translateX(-50%)";


                        imagemAtual.style.opacity =
                            "1";


                        animando =
                            false;

                    },
                    350
                );

            },
            350
        );

    }


    /* =========================================================
       FAVORITOS
    ========================================================= */

    function alternarFavorito() {

        const pokemon =
            detalhes[
                selecionado
            ];


        const id =
            pokemon.id;


        if (
            favoritos.includes(
                id
            )
        ) {

            favoritos =
                favoritos.filter(
                    favorito =>
                        favorito !== id
                );

        }

        else {

            favoritos.push(
                id
            );

        }


        localStorage.setItem(
            "pokemonsFavoritos",
            JSON.stringify(
                favoritos
            )
        );


        atualizarBotaoFavorito();


        criarLista();

    }


    /* =========================================================
       BOTAO FAVORITO
    ========================================================= */

    function atualizarBotaoFavorito() {

        const pokemon =
            detalhes[
                selecionado
            ];


        if (!pokemon) {
            return;
        }


        if (
            favoritos.includes(
                pokemon.id
            )
        ) {

            favoritoBtn.textContent =
                "★ Remover dos favoritos";

        }

        else {

            favoritoBtn.textContent =
                "☆ Adicionar aos favoritos";

        }

    }


    /* =========================================================
       ABA POKEDEX
    ========================================================= */

    abaTodos.addEventListener(
        "click",
        () => {

            modoFavoritos =
                false;


            abaTodos.classList.add(
                "ativa"
            );


            abaFavoritos.classList.remove(
                "ativa"
            );


            criarLista();

        }
    );


    /* =========================================================
       ABA FAVORITOS
    ========================================================= */

    abaFavoritos.addEventListener(
        "click",
        () => {

            modoFavoritos =
                true;


            abaFavoritos.classList.add(
                "ativa"
            );


            abaTodos.classList.remove(
                "ativa"
            );


            criarLista();

        }
    );


    /* =========================================================
       PESQUISA
    ========================================================= */

    campoPesquisa.addEventListener(
        "input",
        () => {

            if (
                campoPesquisa.value
                    .trim() !== ""
            ) {

                limparPesquisa.style.display =
                    "block";

            }

            else {

                limparPesquisa.style.display =
                    "none";

            }


            criarLista();

        }
    );


    /* =========================================================
       LIMPAR PESQUISA
    ========================================================= */

    limparPesquisa.addEventListener(
        "click",
        () => {

            campoPesquisa.value =
                "";


            limparPesquisa.style.display =
                "none";


            criarLista();


            campoPesquisa.focus();

        }
    );


    /* =========================================================
       FILTRO
    ========================================================= */

    filtroTipo.addEventListener(
        "change",
        () => {

            criarLista();

        }
    );


    /* =========================================================
       BOTAO FAVORITO
    ========================================================= */

    favoritoBtn.addEventListener(
        "click",
        alternarFavorito
    );


    /* =========================================================
       TECLADO
    ========================================================= */

    document.addEventListener(
        "keydown",
        event => {


            /*
               Não navega com as setas enquanto
               o usuário estiver digitando na pesquisa.
            */

            if (
                event.target.tagName ===
                "INPUT"
            ) {

                return;

            }


            if (
                event.target.tagName ===
                "SELECT"
            ) {

                return;

            }


            /* =================================================
               SETA PARA BAIXO
            ================================================= */

            if (
                event.key ===
                "ArrowDown"
            ) {

                event.preventDefault();


                if (animando) {
                    return;
                }


                selecionado++;


                if (
                    selecionado >=
                    LIMITE
                ) {

                    selecionado =
                        0;

                }


                trocarPokemon(
                    "baixo"
                );

            }


            /* =================================================
               SETA PARA CIMA
            ================================================= */

            if (
                event.key ===
                "ArrowUp"
            ) {

                event.preventDefault();


                if (animando) {
                    return;
                }


                selecionado--;


                if (
                    selecionado < 0
                ) {

                    selecionado =
                        LIMITE - 1;

                }


                trocarPokemon(
                    "cima"
                );

            }

        }
    );


    /* =========================================================
       INICIAR
    ========================================================= */

    carregarPokemons();

</script>
