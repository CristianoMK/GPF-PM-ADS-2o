<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex</title>

    <link rel="stylesheet" href="pokeantg.css">
</head>

<body>

<div class="pokedex">

    <h1>POKÉDEX</h1>

    <div class="barra-pesquisa">

        <div class="campo-pesquisa">

            <input
                type="text"
                id="campoPesquisa"
                placeholder="🔎 Pesquisar Pokémon pelo nome..."
                autocomplete="off"
            >

            <button
                id="limparPesquisa"
                title="Limpar pesquisa"
            >
                ✕
            </button>

        </div>

        <select id="filtroTipo">
            <option value="todos">
                Todos os tipos
            </option>
        </select>

    </div>

    <div class="abas">

        <button
            class="aba ativa"
            id="abaTodos"
        >
            📖 Pokédex
        </button>

        <button
            class="aba"
            id="abaFavoritos"
        >
            ⭐ Favoritos
        </button>

    </div>

    <div class="conteudo">

        <div class="pokemon-display">

            <div id="numeroPokemon">
                Nº001
            </div>

            <div class="roda">

                <img
                    id="pokemonAnterior"
                    class="pokemon-roda anterior"
                    src=""
                    alt=""
                >

                <img
                    id="pokemonImagem"
                    class="pokemon-roda atual"
                    src=""
                    alt=""
                >

                <img
                    id="pokemonProximo"
                    class="pokemon-roda proximo"
                    src=""
                    alt=""
                >

            </div>

            <div id="pokemonNome">
                CARREGANDO...
            </div>

            <button id="favoritoBtn">
                ☆ Adicionar aos favoritos
            </button>

            <div class="detalhes">

                <div class="detalhe">
                    <span>TIPO</span>

                    <div
                        id="pokemonTipos"
                        class="tipos"
                    >
                        -
                    </div>
                </div>

                <div class="detalhe">
                    <span>HABILIDADES</span>

                    <div id="pokemonHabilidades">
                        -
                    </div>
                </div>

                <div class="detalhe">
                    <span>ALTURA</span>

                    <div id="pokemonAltura">
                        -
                    </div>
                </div>

                <div class="detalhe">
                    <span>PESO</span>

                    <div id="pokemonPeso">
                        -
                    </div>
                </div>

            </div>

            <div class="status">

                <h3>ATRIBUTOS</h3>

                <div class="status-linha">
                    <span>HP</span>
                    <strong id="hp">-</strong>
                </div>

                <div class="status-linha">
                    <span>Ataque</span>
                    <strong id="ataque">-</strong>
                </div>

                <div class="status-linha">
                    <span>Defesa</span>
                    <strong id="defesa">-</strong>
                </div>

                <div class="status-linha">
                    <span>Sp. Ataque</span>
                    <strong id="spAtaque">-</strong>
                </div>

                <div class="status-linha">
                    <span>Sp. Defesa</span>
                    <strong id="spDefesa">-</strong>
                </div>

                <div class="status-linha">
                    <span>Velocidade</span>
                    <strong id="velocidade">-</strong>
                </div>

            </div>

        </div>

        <div id="listaPokemon">

            <div class="carregando">
                Carregando Pokémon...
            </div>

        </div>

    </div>

    <div class="instrucoes">

        ↑ ↓ Use as setas do teclado para navegar

        <br>

        Clique em um Pokémon para visualizar seus detalhes

    </div>

</div>

<script>

const API =
    "https://pokeapi.co/api/v2/pokemon/";

const LIMITE = 151;

const listaPokemon =
    document.getElementById(
        "listaPokemon"
    );

const pokemonImagem =
    document.getElementById(
        "pokemonImagem"
    );

const pokemonAnterior =
    document.getElementById(
        "pokemonAnterior"
    );

const pokemonProximo =
    document.getElementById(
        "pokemonProximo"
    );

const pokemonNome =
    document.getElementById(
        "pokemonNome"
    );

const numeroPokemon =
    document.getElementById(
        "numeroPokemon"
    );

const favoritoBtn =
    document.getElementById(
        "favoritoBtn"
    );

const campoPesquisa =
    document.getElementById(
        "campoPesquisa"
    );

const limparPesquisa =
    document.getElementById(
        "limparPesquisa"
    );

const filtroTipo =
    document.getElementById(
        "filtroTipo"
    );

const abaTodos =
    document.getElementById(
        "abaTodos"
    );

const abaFavoritos =
    document.getElementById(
        "abaFavoritos"
    );

let pokemons = [];

let detalhes = [];

let selecionado = 0;

let animando = false;

let modoFavoritos = false;

let favoritos =
    JSON.parse(
        localStorage.getItem(
            "pokemonsFavoritos"
        )
    ) || [];

async function carregarPokemons() {

    try {

        listaPokemon.innerHTML = `

            <div class="carregando">
                ⏳ Carregando Pokémon...
            </div>

        `;

        const resposta =
            await fetch(
                API +
                "?limit=151&offset=0"
            );

        if (!resposta.ok) {

            throw new Error(
                "Erro na API"
            );

        }

        const dados =
            await resposta.json();

        pokemons =
            dados.results;

        await carregarDetalhes();

        criarFiltros();

        mostrarInicial();

    }

    catch (erro) {

        console.error(erro);

        listaPokemon.innerHTML = `

            <div class="carregando">

                ❌ Erro ao carregar
                os Pokémon.

                <br><br>

                Verifique sua conexão.

            </div>

        `;

    }

}

async function carregarDetalhes() {

    const requisicoes =
        pokemons.map(
            (pokemon, index) => {

                return fetch(
                    API +
                    (index + 1)
                )
                .then(
                    resposta =>
                        resposta.json()
                );

            }
        );

    detalhes =
        await Promise.all(
            requisicoes
        );

}

function criarFiltros() {

    const tipos =
        new Set();

    detalhes.forEach(
        pokemon => {

            pokemon.types.forEach(
                tipo => {

                    tipos.add(
                        tipo.type.name
                    );

                }
            );

        }
    );

    Array
        .from(tipos)
        .sort()
        .forEach(
            tipo => {

                const option =
                    document.createElement(
                        "option"
                    );

                option.value =
                    tipo;

                option.textContent =
                    formatarNome(
                        tipo
                    );

                filtroTipo.appendChild(
                    option
                );

            }
        );

}

function formatarNome(nome) {

    return (
        nome
            .charAt(0)
            .toUpperCase()
    ) +
    nome.slice(1);

}

function criarLista() {

    listaPokemon.innerHTML = "";

    let lista =
        detalhes.map(
            (pokemon, index) => {

                return {
                    pokemon,
                    index
                };

            }
        );

    if (modoFavoritos) {

        lista =
            lista.filter(
                item =>
                    favoritos.includes(
                        item.pokemon.id
                    )
            );

    }

    const pesquisa =
        campoPesquisa.value
            .toLowerCase()
            .trim();

    if (pesquisa !== "") {

        lista =
            lista.filter(
                item =>
                    item.pokemon.name
                        .toLowerCase()
                        .includes(
                            pesquisa
                        )
            );

    }

    const tipoSelecionado =
        filtroTipo.value;

    if (
        tipoSelecionado !==
        "todos"
    ) {

        lista =
            lista.filter(
                item =>
                    item.pokemon.types.some(
                        tipo =>
                            tipo.type.name ===
                            tipoSelecionado
                    )
            );

    }

    if (lista.length === 0) {

        if (modoFavoritos) {

            listaPokemon.innerHTML = `

                <div class="nenhum">
                    ⭐ Nenhum Pokémon
                    favorito encontrado.
                </div>

            `;

        }

        else {

            listaPokemon.innerHTML = `

                <div class="nenhum">

                    🔍 Nenhum Pokémon encontrado.

                    <br><br>

                    Tente outro nome ou tipo.

                </div>

            `;

        }

        return;

    }

    lista.forEach(
        itemDados => {

            const pokemon =
                itemDados.pokemon;

            const index =
                itemDados.index;

            const item =
                document.createElement(
                    "div"
                );

            item.classList.add(
                "pokemon-item"
            );

            if (
                index ===
                selecionado
            ) {

                item.classList.add(
                    "selecionado"
                );

            }

            const numero =
                String(
                    pokemon.id
                )
                .padStart(
                    3,
                    "0"
                );

            const ehFavorito =
                favoritos.includes(
                    pokemon.id
                );

            item.innerHTML = `

                Nº${numero}

                ${pokemon.name.toUpperCase()}

                <span class="estrela">

                    ${
                        ehFavorito
                            ? "★"
                            : "☆"
                    }

                </span>

            `;

            item.addEventListener(
                "click",
                () => {

                    if (animando) {
                        return;
                    }

                    if (
                        index ===
                        selecionado
                    ) {

                        criarLista();

                        return;

                    }

                    const direcao =
                        index >
                        selecionado
                            ? "baixo"
                            : "cima";

                    selecionado =
                        index;

                    trocarPokemon(
                        direcao
                    );

                }
            );

            listaPokemon.appendChild(
                item
            );

        }
    );

}

function mostrarInicial() {

    const atual =
        detalhes[
            selecionado
        ];

    const anterior =
        detalhes[
            (
                selecionado -
                1 +
                LIMITE
            ) %
            LIMITE
        ];

    const proximo =
        detalhes[
            (
                selecionado +
                1
            ) %
            LIMITE
        ];

    pokemonImagem.src =
        atual.sprites
            .front_default;

    pokemonAnterior.src =
        anterior.sprites
            .front_default;

    pokemonProximo.src =
        proximo.sprites
            .front_default;

    atualizarInformacoes(
        atual
    );

    criarLista();

}

function atualizarInformacoes(
    pokemon
) {

    numeroPokemon.textContent =
        "Nº" +
        String(
            pokemon.id
        )
        .padStart(
            3,
            "0"
        );

    pokemonNome.textContent =
        pokemon.name
            .toUpperCase();

    const tipos =
        document.getElementById(
            "pokemonTipos"
        );

    tipos.innerHTML = "";

    pokemon.types.forEach(
        tipo => {

            const span =
                document.createElement(
                    "span"
                );

            span.className =
                "tipo";

            span.textContent =
                formatarNome(
                    tipo.type.name
                );

            tipos.appendChild(
                span
            );

        }
    );

    document.getElementById(
        "pokemonHabilidades"
    ).textContent =

        pokemon.abilities
            .map(
                habilidade =>
                    formatarNome(
                        habilidade
                            .ability
                            .name
                    )
            )
            .join(", ");

    document.getElementById(
        "pokemonAltura"
    ).textContent =

        (
            pokemon.height /
            10
        ) +
        " m";

    document.getElementById(
        "pokemonPeso"
    ).textContent =

        (
            pokemon.weight /
            10
        ) +
        " kg";

    document.getElementById(
        "hp"
    ).textContent =
        pokemon.stats[0]
            .base_stat;

    document.getElementById(
        "ataque"
    ).textContent =
        pokemon.stats[1]
            .base_stat;

    document.getElementById(
        "defesa"
    ).textContent =
        pokemon.stats[2]
            .base_stat;

    document.getElementById(
        "spAtaque"
    ).textContent =
        pokemon.stats[3]
            .base_stat;

    document.getElementById(
        "spDefesa"
    ).textContent =
        pokemon.stats[4]
            .base_stat;

    document.getElementById(
        "velocidade"
    ).textContent =
        pokemon.stats[5]
            .base_stat;

    atualizarBotaoFavorito();

}

function trocarPokemon(
    direcao
) {

    if (animando) {
        return;
    }

    animando = true;

    const imagemAtual =
        pokemonImagem;

    imagemAtual.classList.remove(
        "saindo-baixo",
        "saindo-cima",
        "entrando-baixo",
        "entrando-cima"
    );

    void imagemAtual.offsetWidth;

    if (
        direcao ===
        "baixo"
    ) {

        imagemAtual.classList.add(
            "saindo-baixo"
        );

    }

    else {

        imagemAtual.classList.add(
            "saindo-cima"
        );

    }

    setTimeout(
        () => {

            const novoAtual =
                detalhes[
                    selecionado
                ];

            const novoAnterior =
                detalhes[
                    (
                        selecionado -
                        1 +
                        LIMITE
                    ) %
                    LIMITE
                ];

            const novoProximo =
                detalhes[
                    (
                        selecionado +
                        1
                    ) %
                    LIMITE
                ];

            pokemonAnterior.src =
                novoAnterior
                    .sprites
                    .front_default;

            pokemonProximo.src =
                novoProximo
                    .sprites
                    .front_default;

            imagemAtual.classList.remove(
                "saindo-baixo",
                "saindo-cima"
            );

            if (
                direcao ===
                "baixo"
            ) {

                imagemAtual.style.transform =
                    "translateX(-50%) translateY(-150px) scale(0.5)";

            }

            else {

                imagemAtual.style.transform =
                    "translateX(-50%) translateY(150px) scale(0.5)";

            }

            imagemAtual.style.opacity =
                "0";

            imagemAtual.src =
                novoAtual
                    .sprites
                    .front_default;

            void imagemAtual.offsetWidth;

            imagemAtual.style.transform =
                "";

            imagemAtual.style.opacity =
                "";

            if (
                direcao ===
                "baixo"
            ) {

                imagemAtual.classList.add(
                    "entrando-baixo"
                );

            }

            else {

                imagemAtual.classList.add(
                    "entrando-cima"
                );

            }

            atualizarInformacoes(
                novoAtual
            );

            criarLista();

            setTimeout(
                () => {

                    imagemAtual.classList.remove(
                        "entrando-baixo",
                        "entrando-cima"
                    );

                    imagemAtual.style.transform =
                        "translateX(-50%)";

                    imagemAtual.style.opacity =
                        "1";

                    animando =
                        false;

                },
                350
            );

        },
        350
    );

}

function alternarFavorito() {

    const pokemon =
        detalhes[
            selecionado
        ];

    const id =
        pokemon.id;

    if (
        favoritos.includes(
            id
        )
    ) {

        favoritos =
            favoritos.filter(
                favorito =>
                    favorito !== id
            );

    }

    else {

        favoritos.push(
            id
        );

    }

    localStorage.setItem(
        "pokemonsFavoritos",
        JSON.stringify(
            favoritos
        )
    );

    atualizarBotaoFavorito();

    criarLista();

}

function atualizarBotaoFavorito() {

    const pokemon =
        detalhes[
            selecionado
        ];

    if (!pokemon) {
        return;
    }

    if (
        favoritos.includes(
            pokemon.id
        )
    ) {

        favoritoBtn.textContent =
            "★ Remover dos favoritos";

    }

    else {

        favoritoBtn.textContent =
            "☆ Adicionar aos favoritos";

    }

}

abaTodos.addEventListener(
    "click",
    () => {

        modoFavoritos =
            false;

        abaTodos.classList.add(
            "ativa"
        );

        abaFavoritos.classList.remove(
            "ativa"
        );

        criarLista();

    }
);

abaFavoritos.addEventListener(
    "click",
    () => {

        modoFavoritos =
            true;

        abaFavoritos.classList.add(
            "ativa"
        );

        abaTodos.classList.remove(
            "ativa"
        );

        criarLista();

    }
);

campoPesquisa.addEventListener(
    "input",
    () => {

        if (
            campoPesquisa.value
                .trim() !== ""
        ) {

            limparPesquisa.style.display =
                "block";

        }

        else {

            limparPesquisa.style.display =
                "none";

        }

        criarLista();

    }
);

limparPesquisa.addEventListener(
    "click",
    () => {

        campoPesquisa.value =
            "";

        limparPesquisa.style.display =
            "none";

        criarLista();

        campoPesquisa.focus();

    }
);

filtroTipo.addEventListener(
    "change",
    () => {

        criarLista();

    }
);

favoritoBtn.addEventListener(
    "click",
    alternarFavorito
);

document.addEventListener(
    "keydown",
    event => {

        if (
            event.target.tagName ===
            "INPUT"
        ) {

            return;

        }

        if (
            event.target.tagName ===
            "SELECT"
        ) {

            return;

        }

        if (
            event.key ===
            "ArrowDown"
        ) {

            event.preventDefault();

            if (animando) {
                return;
            }

            selecionado++;

            if (
                selecionado >=
                LIMITE
            ) {

                selecionado =
                    0;

            }

            trocarPokemon(
                "baixo"
            );

        }

        if (
            event.key ===
            "ArrowUp"
        ) {

            event.preventDefault();

            if (animando) {
                return;
            }

            selecionado--;

            if (
                selecionado < 0
            ) {

                selecionado =
                    LIMITE - 1;

            }

            trocarPokemon(
                "cima"
            );

        }

    }
);

carregarPokemons();

</script>

</body>

</html>
