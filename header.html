<header class="topo">

    <!-- Botão do menu lateral -->
    <button
        class="botao-menu d-md-none"
        id="botao-menu"
        type="button"
        aria-label="Abrir menu de navegação"
        aria-controls="menu"
        aria-expanded="false"
    >
        <svg
            xmlns="http://www.w3.org/2000/svg"
            width="32"
            height="32"
            fill="currentColor"
            viewBox="0 0 16 16"
        >
            <path d="M0 3a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V3zm2-1a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3V2H2zm4 0v12h8a1 1 0 0 0 1-1V3a1 1 0 0 0-1-1H6z"/>
            <path d="M7 4h6v1H7V4zm0 2h6v1H7V6zm0 2h4v1H7V8z"/>
        </svg>
    </button>

    <!-- Barra de pesquisa -->
        <form class="barra-pesquisa-header">

            <select
                class="categoria-pesquisa"
                aria-label="Categoria da pesquisa"
            >
                <option value="pokemon">Pokémon</option>
                <option value="itens">Itens</option>
            </select>

            <input
                type="search"
                class="campo-pesquisa-header"
                placeholder="Pesquise aqui"
                aria-label="Pesquisar"
            >

            <button
                class="botao-pesquisa-header"
                type="submit"
                aria-label="Pesquisar"
            >
                <svg xmlns="http://www.w3.org/2000/svg"
                width="32" height="32"
                alt = "pes"
                fill="currentColor"
                class="bi bi-search text-white icone-pesquisa"
                viewBox="0 0 16 16">
                <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"/>
            </svg>
            </button>

        </form>
    <!-- Logo -->
    <img
        src="./assets/sprites/logo.png"
        alt="Logo PokédexAAAAAAA"
        class="logo-topo"
    >

</header>
