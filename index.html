<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Pokedex - GPF</title>
</head>

<body>

    <aside id="menu"></aside>


    <main>
        <section class="barra_pesquisa">
            <input type="text" placeholder="Pesquisar Pokemons, Ginásios, Itens...">

            <button type="submit">
                <img src="./assets/sprites/lupa_icone.png" class="icone" alt="Lupa">
            </button>

        </section>
        <h1>Bem-vindo à Pokedex!</h1>
        <p>Explore o mundo dos Pokémon e descubra informações sobre suas criaturas favoritas.</p>
        <h2>Você pesquisou:</h2>
        <p class="pesquisa_resultado" id="pesquisou_um"></p>
    </main>

    <footer></footer>
    <script src="script.js"></script>
</body>
